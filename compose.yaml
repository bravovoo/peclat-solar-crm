services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: peclat
      POSTGRES_USER: peclat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peclat_local}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U peclat -d peclat']
      interval: 5s
      timeout: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  postgres_data:
